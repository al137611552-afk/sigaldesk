<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;background:#0e1116;color:#e6edf3;
      font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    a{color:#58a6ff} a:hover{color:#79bbff}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-variant-numeric:tabular-nums}
    .lbl{color:#8b949e;font-size:11px;letter-spacing:.3px}
    .sec-title{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
    .sec-title b{font-size:13px;font-weight:600}
    .callout{margin-top:8px;padding:10px 12px;background:#161b22;
      border-left:2px solid #d29922;border-radius:0 6px 6px 0;font-size:12px;line-height:1.65}
    .legend{display:flex;gap:20px;margin-top:9px;flex-wrap:wrap}
    .legend span{display:flex;align-items:center;gap:7px;font-size:12px}
    .swatch{width:9px;height:9px;border-radius:2.5px;flex:none}
  </style>
</helmet>

<div style="width:770px;padding:16px;display:flex;flex-direction:column;gap:15px;background:#0e1116">

  <!-- ① 超额收益 —— 全页最重要的区块 -->
  <div>
    <div class="sec-title"><b>超额收益</b><span class="lbl">判据 = 规则期望 − 随机进场基准</span></div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
      <div style="background:#161b22;border:1px solid #262c36;border-radius:8px;padding:9px 12px">
        <div class="lbl">规则期望 / 条</div>
        <div class="mono" style="font-size:17px;line-height:1.2;margin-top:2px;color:{{ ruleColor }}">{{ ruleExp }}</div>
      </div>
      <div style="background:#161b22;border:1px solid #262c36;border-radius:8px;padding:9px 12px">
        <div class="lbl">随机进场基准</div>
        <div class="mono" style="font-size:17px;line-height:1.2;margin-top:2px;color:#8b949e">{{ baseExp }}</div>
      </div>
      <div style="background:#161b22;border:1px solid {{ excessBorder }};border-radius:8px;padding:9px 12px">
        <div class="lbl">超额</div>
        <div class="mono" style="font-size:17px;line-height:1.2;margin-top:2px;color:{{ excessColor }}">{{ excessVal }}</div>
      </div>
    </div>

    <!-- 置信区间：零线固定在中央，区间条跨零就变灰并出现警示 -->
    <svg viewBox="0 0 740 50" width="100%" height="50" style="margin-top:10px;display:block">
      <line x1="0" y1="30" x2="740" y2="30" stroke="#262c36" stroke-width="1"></line>
      <line x1="370" y1="6" x2="370" y2="34" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"></line>
      <rect x="{{ ciX }}" y="15" width="{{ ciW }}" height="7" rx="3.5" fill="{{ ciFill }}"></rect>
      <circle cx="{{ dotX }}" cy="18.5" r="4.5" fill="{{ excessColor }}"></circle>
      <text x="370" y="47" fill="#8b949e" font-size="10" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">0</text>
      <text x="2" y="47" fill="#8b949e" font-size="10" text-anchor="start" font-family="ui-monospace,Menlo,monospace">{{ axisLo }}</text>
      <text x="738" y="47" fill="#8b949e" font-size="10" text-anchor="end" font-family="ui-monospace,Menlo,monospace">{{ axisHi }}</text>
    </svg>

    <sc-if value="{{ crossesZero }}" hint-placeholder-val="{{ true }}">
      <div class="callout">
        <b>95% 区间跨零</b>，这份样本分辨不出优势。<span class="mono">{{ ciText }}</span>　
        <span class="lbl">n={{ n }} · 标准误 ±{{ seText }}</span><br>
        样本量翻四倍才能把区间收窄一半 —— 在此之前不要据此调参数。
      </div>
    </sc-if>
    <sc-if value="{{ solid }}" hint-placeholder-val="{{ false }}">
      <div class="legend">
        <span><i class="swatch" style="background:{{ excessColor }}"></i>95% 区间 <span class="mono">{{ ciText }}</span></span>
        <span class="lbl">n={{ n }} · 标准误 ±{{ seText }} · 区间未跨零</span>
      </div>
    </sc-if>
  </div>

  <!-- ② 权益曲线 -->
  <div>
    <div class="sec-title"><b>权益曲线</b><span class="lbl">按信号时间累计 · 下方为回撤</span></div>
    <svg viewBox="0 0 740 96" width="100%" height="96" style="display:block">
      <line x1="0" y1="{{ eqZeroY }}" x2="740" y2="{{ eqZeroY }}" stroke="#262c36" stroke-width="1" stroke-dasharray="3 3"></line>
      <path d="{{ ddPath }}" fill="#ef535022" stroke="none"></path>
      <path d="{{ eqPath }}" fill="none" stroke="{{ eqColor }}" stroke-width="1.6"
            stroke-linejoin="round" stroke-linecap="round"></path>
      <text x="4" y="10" fill="#8b949e" font-size="10" font-family="ui-monospace,Menlo,monospace">{{ eqTop }}</text>
      <text x="736" y="94" fill="#8b949e" font-size="10" text-anchor="end" font-family="ui-monospace,Menlo,monospace">最大回撤 {{ maxDd }}</text>
    </svg>
  </div>

  <!-- ③④ 并排：都是"分布"视角，放一行省高度 -->
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px">
    <div>
      <div class="sec-title"><b>浮盈 / 浮亏散点</b><span class="lbl">每点一条信号</span></div>
      <svg viewBox="0 0 360 126" width="100%" height="126" style="display:block">
        <rect x="34" y="6" width="320" height="88" fill="#12172080"></rect>
        <!-- 止盈线是水平的（浮盈达到就止盈），止损线是垂直的（浮亏达到就止损）；
             标签各自贴在自己那条线旁边，别都堆在底部 -->
        <line x1="34" y1="{{ tgtY }}" x2="354" y2="{{ tgtY }}" stroke="#26a69a" stroke-width="1" stroke-dasharray="4 3"></line>
        <text x="356" y="{{ tgtLabelY }}" fill="#26a69a" font-size="9" text-anchor="end"
              font-family="ui-monospace,Menlo,monospace">止盈 {{ targetTxt }}</text>
        <line x1="{{ stopX }}" y1="6" x2="{{ stopX }}" y2="94" stroke="#ef5350" stroke-width="1" stroke-dasharray="4 3"></line>
        <text x="{{ stopLabelX }}" y="104" fill="#ef5350" font-size="9" text-anchor="middle"
              font-family="ui-monospace,Menlo,monospace">止损 {{ stopTxt }}</text>
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="24">
          <circle cx="{{ d.x }}" cy="{{ d.y }}" r="2.4" fill="{{ d.c }}" opacity="0.75"></circle>
        </sc-for>
        <text x="30" y="12" fill="#8b949e" font-size="9" text-anchor="end" font-family="ui-monospace,Menlo,monospace">浮盈</text>
        <text x="30" y="94" fill="#8b949e" font-size="9" text-anchor="end" font-family="ui-monospace,Menlo,monospace">0</text>
        <text x="34" y="120" fill="#8b949e" font-size="9" font-family="ui-monospace,Menlo,monospace">← 浮亏更大</text>
        <text x="354" y="120" fill="#8b949e" font-size="9" text-anchor="end" font-family="ui-monospace,Menlo,monospace">浮亏 0</text>
      </svg>
    </div>
    <div>
      <div class="sec-title"><b>收益分布</b><span class="lbl">每条信号净收益</span></div>
      <svg viewBox="0 0 360 126" width="100%" height="126" style="display:block">
        <sc-for list="{{ bins }}" as="b" hint-placeholder-count="15">
          <rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" fill="{{ b.c }}" rx="1"></rect>
        </sc-for>
        <line x1="{{ zeroX }}" y1="6" x2="{{ zeroX }}" y2="94" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"></line>
        <line x1="{{ meanX }}" y1="6" x2="{{ meanX }}" y2="94" stroke="{{ excessColor }}" stroke-width="1.4"></line>
        <text x="{{ zeroX }}" y="106" fill="#8b949e" font-size="9" text-anchor="middle"
              font-family="ui-monospace,Menlo,monospace">0</text>
        <text x="{{ meanX }}" y="120" fill="{{ excessColor }}" font-size="9" text-anchor="{{ meanAnchor }}"
              font-family="ui-monospace,Menlo,monospace">均值 {{ meanTxt }}</text>
      </svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "sample":{"editor":"enum","options":["样本不足（当前真实状态）","样本充足"],"default":"样本不足（当前真实状态）","section":"数据状态"},
  "$preview":{"width":770,"height":420}
}'>
class Component extends DCLogic {
  // 确定性伪随机，保证每次渲染一致（设计稿不该每次刷新都变样）
  rng(seed) { let s = seed; return () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff; }

  renderVals() {
    const healthy = this.props.sample === '样本充足';
    const n = healthy ? 380 : 50;
    // 真实取值：本地 50 条时 规则期望 -0.0196%、基准 +0.0099%、超额 -0.0295%、SE ±0.0374%
    const ruleE = healthy ? 0.052 : -0.0196;
    const baseE = healthy ? 0.008 : 0.0099;
    const se    = healthy ? 0.0135 : 0.0374;
    const excess = ruleE - baseE;
    const lo = excess - 2 * se, hi = excess + 2 * se;
    const crosses = lo < 0 && hi > 0;

    const pct = (v) => (v >= 0 ? '+' : '') + v.toFixed(4) + '%';
    const span = Math.max(Math.abs(lo), Math.abs(hi)) * 1.25 || 0.1;
    const X = (v) => 370 + (v / span) * 370;
    const color = crosses ? '#8b949e' : (excess > 0 ? '#26a69a' : '#ef5350');

    // 权益曲线：按信号顺序累计
    const rnd = this.rng(7);
    const step = healthy ? 0.05 : -0.02;
    let cum = 0, peak = 0, maxDd = 0;
    const eq = [], dd = [];
    for (let i = 0; i < n; i++) {
      cum += step + (rnd() - 0.5) * 0.55;
      peak = Math.max(peak, cum);
      maxDd = Math.max(maxDd, peak - cum);
      eq.push(cum); dd.push(peak - cum);
    }
    const top = Math.max(...eq, 0.3), bot = Math.min(...eq, -0.3);
    const eqY = (v) => 8 + (top - v) / (top - bot) * 62;
    const px = (i) => (i / (n - 1)) * 740;
    const eqPath = eq.map((v, i) => (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + eqY(v).toFixed(1)).join(' ');
    const ddMax = Math.max(...dd, 0.001);
    const ddPath = 'M0 96 ' + dd.map((v, i) => 'L' + px(i).toFixed(1) + ' ' + (96 - (v / ddMax) * 18).toFixed(1)).join(' ') + ' L740 96 Z';

    // 散点：x=最大浮亏（越左越亏），y=最大浮盈（越上越盈）
    const r2 = this.rng(29);
    const dots = [];
    for (let i = 0; i < Math.min(n, 120); i++) {
      const mae = -Math.pow(r2(), 1.5) * 0.5;
      const mfe = Math.pow(r2(), 1.6) * (healthy ? 0.9 : 0.45);
      dots.push({
        x: (34 + (1 - Math.abs(mae) / 0.55) * 320).toFixed(1),
        y: (94 - (mfe / 1.05) * 88).toFixed(1),
        c: mfe > Math.abs(mae) ? '#26a69a' : '#ef5350',
      });
    }

    // 直方图
    const r3 = this.rng(101);
    const vals = [];
    for (let i = 0; i < n; i++) vals.push(step + (r3() - 0.5) * 0.6);
    const vlo = Math.min(...vals), vhi = Math.max(...vals);
    const NB = 15, counts = new Array(NB).fill(0);
    vals.forEach((v) => counts[Math.min(NB - 1, Math.floor((v - vlo) / (vhi - vlo) * NB))]++);
    const cmax = Math.max(...counts);
    const bw = 360 / NB;
    const bins = counts.map((c, i) => ({
      x: (i * bw + 1).toFixed(1), w: (bw - 2).toFixed(1),
      h: Math.max(1, (c / cmax) * 86).toFixed(1),
      y: (94 - (c / cmax) * 86).toFixed(1),
      c: (vlo + (i + 0.5) / NB * (vhi - vlo)) >= 0 ? '#26a69a99' : '#ef535099',
    }));
    const hx = (v) => ((v - vlo) / (vhi - vlo)) * 360;

    return {
      n, crossesZero: crosses, solid: !crosses,
      ruleExp: pct(ruleE), baseExp: pct(baseE), excessVal: pct(excess),
      ruleColor: ruleE >= 0 ? '#26a69a' : '#ef5350',
      excessColor: color,
      excessBorder: crosses ? '#262c36' : color,
      seText: se.toFixed(4) + '%',
      ciText: pct(lo) + ' ~ ' + pct(hi),
      ciX: X(lo).toFixed(1), ciW: Math.max(2, X(hi) - X(lo)).toFixed(1),
      ciFill: crosses ? '#8b949e55' : color + '55',
      dotX: X(excess).toFixed(1),
      axisLo: pct(-span), axisHi: pct(span),
      eqPath, ddPath, eqZeroY: eqY(0).toFixed(1),
      eqColor: cum >= 0 ? '#26a69a' : '#ef5350',
      eqTop: pct(cum), maxDd: maxDd.toFixed(2) + '%',
      dots, bins,
      zeroX: hx(0).toFixed(1), meanX: hx(vals.reduce((a, b) => a + b, 0) / n).toFixed(1),
      // 参考线由口径算出：止损 1.5×ATR、止盈 3.0×ATR，按散点轴的比例换算成坐标
      tgtY: (94 - (0.60 / 1.05) * 88).toFixed(1),
      tgtLabelY: (94 - (0.60 / 1.05) * 88 - 3).toFixed(1),
      stopX: (34 + (1 - 0.30 / 0.55) * 320).toFixed(1),
      stopLabelX: (34 + (1 - 0.30 / 0.55) * 320).toFixed(1),
      targetTxt: '3.0×ATR', stopTxt: '1.5×ATR',
      meanTxt: pct(vals.reduce((a, b) => a + b, 0) / n),
      // 均值线离 0 太近时两个标签会叠在一起（实测），靠锚点错开
      meanAnchor: Math.abs(hx(vals.reduce((a, b) => a + b, 0) / n) - hx(0)) < 40
        ? (hx(vals.reduce((a, b) => a + b, 0) / n) < hx(0) ? 'end' : 'start') : 'middle',
    };
  }
}
</script>
</body>
</html>
