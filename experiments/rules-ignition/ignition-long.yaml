# 动能点火（多头）—— 专治「单边直拉」，**不是**给整理后突破用的
#
# ## 为什么要单独一条
#
# 2026-09-04 夜盘 br2610 从 14760 拉到 15690（+6.30%），现有两条多头规则一条都没报。
# 查下来不是 bug，是它们的结构决定的：
#
#   breakout-long：5m 扳机今晚触发了 3 次（21:10 / 22:25 / 22:45）。
#     · 21:10 那次最该报 —— 刚起涨、量 4.02 倍。但 1h 上最近一根**已收盘**的 bar
#       还是日盘 15:00 收的那根（收 14885 < EMA20 14932.7，均线还在下行），trend 不成立。
#       **夜盘 21:00 开盘、22:00 才有第一根 1h 收盘 —— 每晚开头一小时，
#       1h 趋势用的都是七小时前日盘收的那根。** 等 22:00 确认完，晚了 50 分钟。
#     · 22:25 / 22:45 两次：trend ✓、mid ✓（|收−EMA|/ATR = 0.51，远小于 2.5），
#       却卡在 box（15m 上 20 根 = 5 小时振幅 < 3.83 ATR）—— **被这波行情自己撑破了**。
#
#   kdzx-long：trend ✓、zone ✓，卡在 setup（`double_bottom or cross_up(macd)`）。
#     单边直拉里 MACD 金叉在起涨前就完成了，之后 DIF 一直在 DEA 上方，
#     **不再有"上穿"这个事件**；也没有双底。一次都不触发。
#
# 共同点：**它们都要求"动之前先静"**（横盘、回踩、金叉）。走得越顺越不成立。
# 那是刻意的（不追高），代价就是系统性错过单边行情。所以不去改它们 ——
# 一条规则不该管所有 regime，这条专门补上那个缺口。
#
# ## 判据不是"赚不赚"，是超额
#
# 见 CLAUDE.md 与 stats/baseline.py：样本区间自带漂移，毛收益没有意义，
# 必须减掉"同标的、同方向、同一套出场口径的随机进场"。
# **本文件的阈值是先从分布定下来的，不是照着 09-04 那一夜凑的**（见下）。
id: ignition-long
enabled: false          # ⚠️ 未验证。先用 scripts/rule_eval.py --rules-dir 试算，不进盯盘
description: 动能点火·多头：日线在均线上方，5m 出现放量+波动扩张的区间突破

universe:
  - CN.*
  - CRYPTO.OKX.BTCUSDT.PERP
  - CRYPTO.OKX.ETHUSDT.PERP

timeframes:
  # **大方向放在日线，不放 1h** —— 这是这条规则的关键设计。
  # 日线 bar 在盘中不会变（夜盘属于下一交易日，最近一根已收盘日线是当天日盘收的），
  # 所以不存在 breakout-long 那个"1h 要等到 22:00 才确认、扳机 21:10 就到了"的盲区。
  regime: 1d
  ignite: 5m

conditions:
  # ① 大方向：日线收在 20 均线上方。
  #    **不要求均线斜率向上** —— 日线斜率反应太慢，等它转向，这类行情早走完了。
  #    这一条只用来挡"在下跌趋势里抢反弹"，不承担择时。
  - on: regime
    mode: state
    when: close > ema(close, 20)

  # ② 点火：三件事必须同一根 5m 上一起发生。
  #
  #    · breakout(range(12))：上破前 12 根 5m（1 小时）的区间。
  #      range() **不含当前根**，含了的话当前根永远落在区间内、breakout 恒为假。
  #
  #    · volume > sma(volume, 20) * 3.0：**阈值取自分布，不是照着今晚凑的**。
  #      本地 7 个标的 25,881 根 5m 上，量/20根均量的分位数：
  #        中位 0.79x ｜ p90 1.89x ｜ p95 2.58x ｜ p98 3.96x ｜ p99 5.10x
  #      3.0x 落在 p96~97 —— 真正罕见的那一档。
  #      （09-04 夜盘那两根是 6.71x ≈ p99.5 和 4.02x ≈ p98，都在门槛之上；
  #        22:25 那根 1.79x ≈ p88，够不着 —— 这正是想要的：只报第一口。）
  #
  #    · range_atr(6) > 4.0：最近 6 根（半小时）的振幅 > 4 倍 ATR，即**波动在扩张**。
  #      同一份样本上 range_atr(6) 的分位：中位 2.36 ｜ p90 3.96 ｜ p95 4.59。
  #      4.0 取 p90。这一条和 breakout 的 box（`range_atr(20) < 3.83`）**正好相反** ——
  #      那条要"动之前先静"，这条要"已经动起来了"。两条规则互斥是有意的。
  #
  #    三件事写在同一个 event 里而不是拆成三级：拆开的话 state 段可能在扳机那一根
  #    才刚成立，链路的先后次序反而要看实现细节；点火本来就是"同时发生"才算数。
  - on: ignite
    mode: event
    when: >
      breakout(range(12), dir='up')
      and volume > sma(volume, 20) * 3.0
      and range_atr(6) > 4.0

context:
  atr14: atr(14)
  vol_ratio: volume / sma(volume, 20)
  expansion: range_atr(6)
context_by_role:
  regime:
    ema20: ema(close, 20)
    dist_atr: (close - ema(close, 20)) / atr(14)

emit:
  direction: long
  ttl: 6 bars             # 点火是瞬时事件，布防后 30 分钟没跟上就撤
  cooldown: 60m           # 同一波行情只报第一口，别在拉升途中反复报
  priority: high
  # 绑在日线上：**同一个交易日同标的只报一次**。这条规则抓的是"这一波的起点"，
  # 一波里报第二次没有信息量（09-04 夜盘 21:05 和 21:10 挨着，只该出一条）。
  dedup_key: "{symbol}:{rule}:{regime_bar_close_ts}"
