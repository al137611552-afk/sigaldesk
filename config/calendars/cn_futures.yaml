# 国内期货交易时段。按夜盘长度分组 —— 日盘时段各交易所基本一致，差异都在夜盘。
# holidays 驱动三件事：交易日归属（夜盘归下一交易日）、in_session 判定、
# 以及「法定节假日前最后一个交易日不开夜盘」。空表会让这三件事全部算错。
#
# 数据来源：2026 年国务院办公厅放假安排，取自两个独立公开源交叉核对（33 天完全一致）。
# **只列落在工作日的休市日** —— 周末本来就不开，不必重复列。
# 调休补班的周六周日**不必列**：国务院算作上班日，但期货市场照样休市，
# is_trading_date 只看"是不是周末"，天然正确。
#
# ⚠️ 上线前请与交易所官方休市公告核对一遍。交易所公告才是权威，
#    且个别年份的夜盘暂停安排会与放假安排有出入。
calendars:
  # 黑色系 / 多数农产品：夜盘 21:00-23:00
  cn_night_23:
    sessions: ["09:00-10:15", "10:30-11:30", "13:30-15:00", "21:00-23:00"]
    products: [rb, hc, i, j, jm, m, y, p, a, c, cs, SR, CF, TA, MA, FG, v, pp, l, eg, ru, OI, PL, PX, RM, SH, b, br, bu, bz, eb, fu, op, pg, sp]

  # 有色：夜盘 21:00-01:00（跨零点）
  cn_night_01:
    sessions: ["09:00-10:15", "10:30-11:30", "13:30-15:00", "21:00-01:00"]
    products: [cu, al, zn, pb, ni, sn, ss, bc, ao]

  # 贵金属 / 原油：夜盘 21:00-02:30（跨零点）
  cn_night_0230:
    sessions: ["09:00-10:15", "10:30-11:30", "13:30-15:00", "21:00-02:30"]
    products: [au, ag, sc, pd, pt]

  # 无夜盘
  cn_no_night:
    sessions: ["09:00-10:15", "10:30-11:30", "13:30-15:00"]
    products: [jd, lh, UR, SA, PF, si, lc, AP, CJ, PK, PR, SF, SM, ad, lg, ps]

  # 金融期货：日盘时段与商品不同，无夜盘
  cffex_index:
    sessions: ["09:30-11:30", "13:00-15:00"]
    products: [IF, IC, IH, IM]

  cffex_bond:
    sessions: ["09:30-11:30", "13:00-15:15"]
    products: [T, TF, TS, TL]

