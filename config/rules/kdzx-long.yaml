# 看大做小（多头）—— 全品种通用
#
# 链路：1h 定方向 -> 1h 回到均线附近 -> 5m 出买点 -> 走出箱体才报
#
# **为什么阈值一律 ATR 归一，不用百分比**：
#   全品种跑的话，黄金日内波动 ~0.3%、BTC ~3%，同一个 "0.6%" 对两者含义完全不同。
#   ATR 是各品种自己的波动尺度，用它做分母，一套参数才能通吃 7 个品种。
#
# 调参入口（面板「规则」页改完可以立刻「历史试算」，不用重启）：
#   - trend 的 ema 周期：放大 = 更看长期方向，信号更少
#   - zone 的 atr 倍数：调大 = 允许离均线更远，信号更多
#   - box 的 consolidation：调大 = 对"箱体"要求更松
#
# 想换成更大的级别（更接近日线打法），把 timeframes 里的 trend 改成 4h 或 1d 即可，
# 但**先确认那个周期有足够历史**（scripts/backfill.py 回补），否则永远预热不完、一条不报。
id: kdzx-long
# ⚠️ **历史超额为负，但按用户决定保持启用。** 这不是"已验证能赚"的规则，
# 收到它的信号时请自己判断，别当成系统在替你确认。
#
# 判据不是"赚不赚钱"，而是**超额**：期望减去"随机进场"的期望，且基准要按这条
# 规则自己的信号分布加权（它 101 条打在漂移最大的加密上）。样本区间等权 +10.05%
# （加密 +21%/+27%），不减基准的话所有多头规则都显得很好。
#
#   211 条  毛期望 +0.034%  加权基准 +0.057%  →  超额 -0.023%（扣 1bp 后 -0.043%）
#
# **消融证明不是参数问题** —— 去掉任何一段都还是负的：
#   原版 -0.043% ｜ 去掉箱体 -0.070% ｜ 箱体放宽 -0.070% ｜ 箱体缩短 -0.082%
#   去掉贴近均线 -0.016% ｜ 贴近放宽到 1.6ATR -0.017% ｜ 只要金叉 -0.038% ｜ 只要双底 -0.013%
# 换成 kdzx-short 那套"放量突破"扳机也不行（-0.049% / -0.055%）。
#
# 超额为负意味着：**它挑出来的时刻，比随机时刻更差**。这与市场涨跌无关，
# 所以不是"样本偏多头"能解释的（那只解释空头规则为什么毛收益是负的）。
#
# **但样本只有两个月、单一上涨行情、无样本外验证**，这个结论本身也不牢。
# 复核的正确做法：换一段震荡或下跌行情重跑试算，看超额是否转正。
# **别靠调参把它调回来** —— 上面八个变体已经把参数空间扫过一遍，那只会拟合这两个月。
enabled: true
description: 看大做小·多头：1h 多头趋势中回踩均线，5m 出买点并走出箱体

universe:
  # **国内期货全品种**：`CN.*` 在加载时展开成 symbols.yaml 里所有可交易的 CN 标的
  # （主连自动排除 —— 它不可下单，不该产生预警）。
  # 新增一个期货合约只要往 symbols.yaml 里加，规则文件不用动。
  - CN.*
  # 加密只盯 BTC / ETH：OKX 上几百个永续里绝大多数流动性差、容易被操纵，
  # 而这些规则的 ATR 归一阈值假设了正常深度；每多一个还要多一路 WS 订阅与落盘。
  - CRYPTO.OKX.BTCUSDT.PERP
  - CRYPTO.OKX.ETHUSDT.PERP

timeframes:
  trend: 1h
  zone: 1h
  setup: 5m
  box: 5m

conditions:
  # ① 大级别定方向：1h 收在 20 均线上方，且均线本身在上行
  - on: trend
    mode: state
    when: close > ema(close, 20) and ema(close, 20) > prev(ema(close, 20))

  # ② 回到均线附近才考虑进场（不追高）。ATR 归一，全品种同一套参数
  - on: zone
    mode: state
    when: abs(close - ema(close, 20)) < atr(14) * 0.8

  # ③ 小级别买点：分钟双底，或 MACD 金叉
  - on: setup
    mode: event
    when: double_bottom(5, 0.003) or cross_up(macd_dif(), macd_dea())

  # ④ 买点之后要走出一个箱体（窄幅盘整）才报，避免追在急拉的半山腰
  - on: box
    mode: state
    when: consolidation(12, 0.005)

context:
  atr14: atr(14)
  ema20: ema(close, 20)
context_by_role:
  trend:
    ema20: ema(close, 20)
  zone:
    atr14: atr(14)
    dist_atr: abs(close - ema(close, 20)) / atr(14)

emit:
  direction: long
  ttl: 48 bars            # 布防后 48 根 5m（4 小时）内没等到扳机就撤防
  cooldown: 30m
  priority: high
  dedup_key: "{symbol}:{rule}:{trend_bar_close_ts}"   # 同一根 1h 内每个标的只报一次
