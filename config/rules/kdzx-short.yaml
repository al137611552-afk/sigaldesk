# 看大做小（空头）—— 全品种通用
#
# 链路：1h 定方向（**要求均线真的在下行**）-> 1h 贴近均线 -> 5m 放量下破区间
#
# **为什么阈值一律 ATR 归一，不用百分比**：
#   全品种跑的话，黄金日内波动 ~0.3%、BTC ~3%，同一个 "0.6%" 对两者含义完全不同。
#   ATR 是各品种自己的波动尺度，用它做分母，一套参数才能通吃 7 个品种。
#
# 调参入口（面板「规则」页改完可以立刻「历史试算」，不用重启）：
#   - trend 的 ema 周期：放大 = 更看长期方向，信号更少
#   - **trend 的回看根数**（prev 的第二个参数）：放大 = 要求更持久的下行，信号更少
#   - zone 的 atr 倍数：调大 = 允许离均线更远，信号更多
#   - trigger 的量能倍数：调大 = 只认更放量的突破
#
# 想换成更大的级别（更接近日线打法），把 timeframes 里的 trend 改成 4h 或 1d 即可，
# 但**先确认那个周期有足够历史**（scripts/backfill.py 回补），否则永远预热不完、一条不报。
id: kdzx-short
enabled: true
description: 看大做小·空头：1h 空头趋势中反抽均线，5m 放量下破前 20 根区间

universe:
  # **国内期货全品种**：`CN.*` 在加载时展开成 symbols.yaml 里所有可交易的 CN 标的
  # （主连自动排除 —— 它不可下单，不该产生预警）。
  # 新增一个期货合约只要往 symbols.yaml 里加，规则文件不用动。
  - CN.*
  # 加密只盯 BTC / ETH：OKX 上几百个永续里绝大多数流动性差、容易被操纵，
  # 而这些规则的 ATR 归一阈值假设了正常深度；每多一个还要多一路 WS 订阅与落盘。
  - CRYPTO.OKX.BTCUSDT.PERP
  - CRYPTO.OKX.ETHUSDT.PERP

timeframes:
  trend: 1h
  zone: 1h
  trigger: 5m

conditions:
  # ① 大级别定方向：1h 收在 20 均线下方，且**这条均线比一个交易时段前更低**。
  #
  # **为什么是 prev(ema20, 6) 而不是 prev(ema20)。** 单根差噪声极大：
  # 实例（fu2611，2026-09-02 22:00）ema20 从 3860.48 跌到 3858.15，
  # 降幅 2.33 点 = 0.060% = **0.031 个 ATR** —— 图上就是一条平线，
  # 用户一眼看出「均线明明在向上」。当时真实背景是 09-01 涨了 6.8%、
  # 09-02 回调、夜盘正在反弹，规则却报了个空。
  # 回看 6 根（1h 上约一个交易时段）后，这类"平得看不出方向"的就进不来了。
  #
  # **仍然是同一条均线跟它自己比 —— 测的是朝向。**
  # 曾经试过换成快慢线 `ema20 < ema60`：超额最高（+0.0825%），但那测的是
  # **排列**不是朝向 —— 均线完全可以在慢线下方却正在掉头向上，
  # 那恰恰是本条要挡掉的形态。指标好看不等于语义对，已放弃。
  #
  # 实测（6 标的、约两个月、`scripts/rule_eval.py`，判据是**超额**不是毛收益）：
  #
  #   trend 写法                    条数  胜率    毛期望     超额
  #   prev(ema20)（原版，N=1）      112  34.8%  -0.0120%  +0.0196%
  #   prev(ema20, 3)                 84  34.5%  -0.0071%  +0.0234%
  #   **prev(ema20, 6)（本版）**     71  33.8%  -0.0252%  +0.0069%
  #   prev(ema20, 12)                59  33.9%  -0.0008%  +0.0312%
  #   斜率 > atr*0.05                34  23.5%  -0.0682%  -0.0374%  ← 试过，明显更差
  #
  # ⚠️ **收益上测不出差别**（N 之间非单调，所有 95% 区间都跨零且互相重叠）。
  # 选它的理由是**语义正确 + 图上可验证**，不是这几个数。别拿这张表当调参依据。
  # 复核方向：样本只有 6 标的、两个月、单一上涨行情、无样本外。
  # 换一段震荡或下跌行情重跑（`scripts/rule_eval.py kdzx-short`）。
  - on: trend
    mode: state
    when: close < ema(close, 20) and ema(close, 20) < prev(ema(close, 20), 6)

  # ② 回到均线附近才考虑进场（不追高）。ATR 归一，全品种同一套参数
  - on: zone
    mode: state
    when: abs(close - ema(close, 20)) < atr(14) * 0.8

  # ③ 扳机：放量下破前 20 根 5m 的区间。
  #     （角色原叫 box —— 那是重做前「箱体确认」留下的名字，重做后名不副实，已改名）
  #
  # **这一段是重做过的。** 原来是「双顶/死叉」+「箱体确认」两段，实测超额只有
  # +0.004%（≈ 等于随机做空）。换成放量突破后到 **+0.049%**（120 条），
  # 与 breakout-short 同档。原因大概是：等双顶走完再等 12 根箱体，
  # 反抽那一波已经结束了，进场太晚。突破是"反抽结束"的即时证据。
  #
  # range() **不含当前根** —— 含了的话当前根永远落在区间内，breakout 恒为假。
  # 量能门槛与 breakout-short 一致（内置 volume-spike 用 2.5，这里放松到 1.5）。
  - on: trigger
    mode: event
    when: breakout(range(20), dir='down') and volume > sma(volume, 20) * 1.5

context:
  atr14: atr(14)
  ema20: ema(close, 20)
context_by_role:
  trend:
    ema20: ema(close, 20)
  zone:
    atr14: atr(14)
    dist_atr: abs(close - ema(close, 20)) / atr(14)

emit:
  direction: short
  ttl: 48 bars            # 布防后 48 根 5m（4 小时）内没等到扳机就撤防
  cooldown: 30m
  priority: high
  dedup_key: "{symbol}:{rule}:{trend_bar_close_ts}"   # 同一根 1h 内每个标的只报一次
