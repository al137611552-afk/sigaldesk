# 放量异动：1m 成交量突然放大到均量的 2.5 倍以上且收阳。
# 用途是"有事发生了，去看一眼"，不是入场信号 —— 所以 direction 取 neutral。
id: volume-spike
enabled: false
description: 1m 放量 2.5 倍且收阳，提示异动

# 一条规则同时挂在两个市场上 —— 这正是"双线并行"架构要换来的东西。
universe:
  - CRYPTO.OKX.BTCUSDT.PERP
  - CRYPTO.OKX.ETHUSDT.PERP
  - CN.SHFE.rb2610
  - CN.SHFE.au2610

timeframe: 1m

conditions:
  - on: 1m
    mode: event                # 只在"刚放量"那一根报，放量持续不重复刷屏
    when: "volume > sma(volume, 20) * 2.5 and close > open"

context:
  vol_ratio: "volume / sma(volume,20)"
  ema20: "ema(close,20)"
  rsi14: "rsi(14)"
  atr14: "atr(14)"

emit:
  direction: neutral
  cooldown: 5m
  dedup_key: "{symbol}:{rule}:{bar_close_ts}"
  priority: normal
  channels: [telegram, bark]
