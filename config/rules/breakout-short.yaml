# 趋势中段横盘后继续跌破（空头）—— 全品种通用
#
# 与 kdzx 的分工：kdzx 抓"反抽均线的卖点"，本规则抓"横盘后的跌破"。
# 两者在 ①② 上相似但阈值不同，**有可能同一时刻都触发** ——
# 那时图上会折成「S×2」，详情里能点开看是哪两条。先跑一段看重叠有多少，
# 重叠严重再考虑加互斥条件。
#
# **"中段"是个代理，不是真的知道趋势走了多久。**
# `abs(close-ema20) < atr*2.5` 的意思只是"还没走到极端偏离"，即不是末端加速。
# 真要判"趋势第几根"需要新函数（现在没有）。这个数是主要调参入口：
#   调小 = 只在贴近均线时才认，信号少；调大 = 放宽到已经拉开一段，信号多。
id: breakout-short
enabled: true
description: 突破·空头：1h 空头趋势中段，15m 横盘后 5m 放量下破前 20 根区间

universe:
  # **国内期货全品种**：`CN.*` 在加载时展开成 symbols.yaml 里所有可交易的 CN 标的
  # （主连自动排除 —— 它不可下单，不该产生预警）。
  # 新增一个期货合约只要往 symbols.yaml 里加，规则文件不用动。
  - CN.*
  # 加密只盯 BTC / ETH：OKX 上几百个永续里绝大多数流动性差、容易被操纵，
  # 而这些规则的 ATR 归一阈值假设了正常深度；每多一个还要多一路 WS 订阅与落盘。
  - CRYPTO.OKX.BTCUSDT.PERP
  - CRYPTO.OKX.ETHUSDT.PERP

timeframes:
  trend: 1h
  mid: 1h
  box: 15m
  brk: 5m

conditions:
  # ① 大方向：1h 收在 20 均线下方且均线下行（与 kdzx 同）
  - on: trend
    mode: state
    when: close < ema(close, 20) and ema(close, 20) < prev(ema(close, 20))

  # ② "中段"的代理：还没跌爆。见文件头 —— 这是个粗糙代理，也是主要调参入口
  - on: mid
    mode: state
    when: abs(close - ema(close, 20)) < atr(14) * 2.5

  # ③ 横盘调整：15m 上 20 根（5 小时）的振幅小于 3.83 倍 ATR。
  #
  # **原来是 `consolidation(20, 0.008)` —— 固定百分比，那是个 bug。**
  # 本文件其余阈值都 ATR 归一（理由见 kdzx 的注释：各品种波动尺度差好几倍），
  # 只有这一条是例外，后果是它**事实上不适用于高波动品种**：
  # 实测同一段"5 小时振幅"占价格的中位数，铜 0.81%、股指 1.89%（差 2.3 倍），
  # 于是 `< 0.8%` 在铜上 49.8% 的时间成立、在股指上只有 **0.3%** ——
  # 各品种命中率极差 **170 倍**。规则声称 `universe: CN.*` 覆盖全品种，实际不是。
  # 用户在 UR701 上踩到（box 0/123），排查了一轮才发现不是"最近没横盘"。
  #
  # 换成 ATR 倍数后，同一段振幅是 4.3~5.2 倍（离散度 2.3 倍 -> 1.2 倍），
  # 命中率极差 170 倍 -> **2.7 倍**，股指从 0.3% 回到 25.7%。
  #
  # **3.83 是"与原阈值等量"的那个点**（总命中率同为 26.9%）——
  # 改动是纯粹的重新分配，不放大信号总量，不增加要人工过滤的噪声。
  #
  # ⚠️ **收益上没有测出好处。** 实测（6 标的、约两个月、scripts/rule_eval.py）：
  #
  #   box 阈值        long 条数/超额        short 条数/超额
  #   0.008 固定%      103 / -0.0054%        64 / +0.0374%
  #   3.00 x ATR        26 / +0.0634%        15 / +0.0779%   n 太小，标准误 ±0.07
  #   **3.83 x ATR**    87 / -0.0261%        70 / -0.0253%
  #   4.50 x ATR       153 / -0.0315%       105 / +0.0182%
  #
  # 非单调、全部落在噪声里 —— 这份样本分辨不了。**3.83 是看收益数字之前就定下的**
  # （按"等量"选），不改成事后看着最好的 3.00：那就是过拟合。
  # 改它的理由是**语义正确与全品种公平**，不是这几个数。
  - on: box
    mode: state
    when: range_atr(20) < 3.83

  # ④ 扳机：下破前 20 根 5m 的区间 + 放量。
  #    range() **不含当前根** —— 含了的话当前根永远落在区间内，breakout 恒为假。
  #    量能门槛沿用内置 volume-spike 的口径（那条用 2.5，这里放松到 1.5）：
  #    图上那条量能均线和规则看的必须是同一个数，否则看不出它当时为什么触发。
  #    **无量破位同样是典型假突破**，这一段不能省。
  - on: brk
    mode: event
    when: breakout(range(20), dir='down') and volume > sma(volume, 20) * 1.5

context:
  atr14: atr(14)
  vol_ratio: volume / sma(volume, 20)
context_by_role:
  mid:
    ema20: ema(close, 20)
    dist_atr: abs(close - ema(close, 20)) / atr(14)
  box:
    box_high: highest(high, 20)
    box_low: lowest(low, 20)

emit:
  direction: short
  ttl: 24 bars            # 布防后 24 根 5m（2 小时）内没等到跌破就撤防
  cooldown: 30m
  priority: high
  dedup_key: "{symbol}:{rule}:{box_bar_close_ts}"
