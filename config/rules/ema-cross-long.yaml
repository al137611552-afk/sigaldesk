# M1 单级别示例：15m 上穿 20 均线且放量。
# 多级别（趋势/回调/扳机三段式 + 状态机 + TTL）是 M2，目标形态见 docs/examples/m2-trend-pullback.yaml。
id: ema-cross-long
enabled: false
description: 15m 收盘上穿 EMA20，且量能高于 20 根均量的 1.5 倍

universe:
  - CRYPTO.OKX.BTCUSDT.PERP
  - CRYPTO.OKX.ETHUSDT.PERP

timeframe: 15m

conditions:
  - on: 15m
    mode: event              # 边沿：上一根不成立、这一根成立
    when: "cross_up(close, ema(close,20)) and volume > sma(volume,20) * 1.5"

# 触发时快照的关键值 —— 推送正文与事后统计都读这里。
context:
  ema20: "ema(close,20)"
  ema60: "ema(close,60)"
  rsi14: "rsi(14)"
  atr14: "atr(14)"
  vol_ratio: "volume / sma(volume,20)"

emit:
  direction: long
  confirm_on_close: true
  cooldown: 30m
  dedup_key: "{symbol}:{rule}:{bar_close_ts}"
  priority: high
  channels: [telegram, bark]
